<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/icon.jpg">
<title>Login - Asset Management System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

  <div class="w-full max-w-md bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden flex flex-col">
    
    <div class="p-6 bg-slate-900 text-white border-b border-slate-700 text-center">
      <div class="inline-flex p-3 bg-slate-800 text-blue-500 rounded-xl mb-3">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold">Asset Manager</h1>
      <p class="text-sm text-slate-400">Admin Authentication Terminal</p>
    </div>

    <div class="p-8">
      <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
        
        <div>
          <label class="block mb-1.5 font-medium text-sm text-slate-700">EMAIL ADDRESS</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
            <input type="email" id="email" required placeholder="name@company.com" 
              class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="font-medium text-sm text-slate-700">PASSWORD</label>
            <a href="#" class="text-xs text-blue-600 hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
            <input type="password" id="password" required placeholder="••••••••" 
              class="w-full pl-10 pr-10 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600 focus:outline-none">
              <i id="passwordToggleIcon" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center">
          <input type="checkbox" id="remember" class="h-4 w-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300">
          <label for="remember" class="ml-2 block text-xs text-slate-600 font-medium cursor-pointer">
            Remember this terminal session
          </label>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition flex items-center justify-center gap-2 mt-2 shadow-sm">
          <span>Authenticate Session</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

    <div class="bg-slate-50 border-t px-6 py-4 text-center text-xs text-slate-500 font-medium">
      Protected Environment. Unauthorized Access Prohibited.
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 space-y-3 z-50 pointer-events-none"></div>

<script>
// Toggle Password Visibility Logic
function togglePasswordVisibility() {
  const passwordInput = document.getElementById("password");
  const toggleIcon = document.getElementById("passwordToggleIcon");
  
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    toggleIcon.setAttribute("data-lucide", "eye-off");
  } else {
    passwordInput.type = "password";
    toggleIcon.setAttribute("data-lucide", "eye");
  }
  lucide.createIcons(); // Recalculate icon layout
}

// Global UI Notifications Function (Matches Dashboard codebase)
function showToast(message, type = 'success') {
  const container = document.getElementById("toast-container");
  if (!container) return;

  const toast = document.createElement("div");
  toast.className = `p-4 rounded-xl shadow-lg border text-sm transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-auto flex items-center gap-2 min-w-[280px] max-w-sm `;
  
  if (type === 'success') {
    toast.className += "bg-emerald-50 border-emerald-200 text-emerald-800";
    toast.innerHTML = `✅ <span>${message}</span>`;
  } else {
    toast.className += "bg-rose-50 border-rose-200 text-rose-800";
    toast.innerHTML = `❌ <span>${message}</span>`;
  }

  container.appendChild(toast);
  setTimeout(() => toast.classList.remove("opacity-0", "translate-y-2"), 10);
  setTimeout(() => {
    toast.classList.add("opacity-0", "translate-y-2");
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

// Form Submission Integration Stub
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    // Substitute this endpoint section block with your actual authentication API route mapping
    /*
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    if (!response.ok) throw new Error("Invalid credentials context");
    */
    
    showToast("Authentication confirmed. Redirecting...", "success");
    setTimeout(() => {
      window.location.href = "/index.html"; // Swap with your actual dashboard script file route
    }, 1200);

  } catch(err) {
    showToast(err.message, "error");
  }
}

// Bootstrap Lucide Icons on layout compilation
lucide.createIcons();
</script>
</body>
</html>
