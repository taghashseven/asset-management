<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/icon.jpg">
  <title>Asset Management Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .dropdown-menu.hidden { display: none; }
  </style>
</head>
<body class="bg-slate-100">

<div class="flex h-screen">
  <!-- Sidebar Navigation -->
  <aside class="w-72 bg-slate-900 text-white flex flex-col shrink-0">
    <div class="p-5 border-b border-slate-700">
      <h1 class="text-2xl font-bold">Asset Manager</h1>
      <p class="text-sm text-slate-400">Admin Dashboard</p>
    </div>
      <nav class="flex-1 p-4 space-y-2" id="sidebarNav">
  <button class="nav-btn w-full text-left p-3 rounded bg-slate-800 font-semibold" data-module="employees">Employees</button>
  <button class="nav-btn w-full text-left p-3 rounded hover:bg-slate-800" data-module="user-resources">User and Resource</button>
  <button class="nav-btn w-full text-left p-3 rounded hover:bg-slate-800" data-module="forms">Forms</button>

  <button class="nav-btn w-full text-left p-3 rounded hover:bg-slate-800" data-module="computer-assets">Computer Assets</button>
  <button class="nav-btn w-full text-left p-3 rounded hover:bg-slate-800" data-module="asset-assignments">Asset Assignments</button>
  <button class="nav-btn w-full text-left p-3 rounded hover:bg-slate-800" data-module="monitors">Monitors</button>
  <button class="nav-btn w-full text-left p-3 rounded hover:bg-slate-800" data-module="other_equipment">Other Equipment</button>

  <button class="nav-btn w-full text-left p-3 rounded hover:bg-slate-800" data-module="monitor-assignments">Monitor Assignments</button>
  
  <!-- Collapsible Printers Group -->
  <div class="space-y-1">
    <button 
      id="printersMenuToggle" 
      type="button"
      class="w-full text-left p-3 rounded hover:bg-slate-800 flex items-center justify-between font-semibold text-slate-200"
    >
      <span class="flex items-center gap-2">🞈 Printers System</span>
      <span id="printersArrow" class="text-xs transition-transform duration-200">▼</span>
    </button>
    
    <ul id="printersSubmenu" class="hidden pl-4 space-y-1">
      <li>
        <button class="nav-btn w-full text-left p-2.5 rounded hover:bg-slate-800 text-sm text-slate-300" data-module="printers">Dashboard Overview</button>
      </li>
      <li>
        <button class="nav-btn w-full text-left p-2.5 rounded hover:bg-slate-800 text-sm text-slate-300" data-module="printers-list">Printers List</button>
      </li>
      <li>
        <button class="nav-btn w-full text-left p-2.5 rounded hover:bg-slate-800 text-sm text-slate-300" data-module="toner-stock">Toner Stock</button>
      </li>
      <li>
        <button class="nav-btn w-full text-left p-2.5 rounded hover:bg-slate-800 text-sm text-slate-300" data-module="printer-logs">Printer Logs</button>
      </li>
    </ul>
  </div>

  <button class="nav-btn w-full text-left p-3 rounded hover:bg-slate-800" data-module="api-database">API database</button>
  <button class="nav-btn w-full text-left p-3 rounded hover:bg-slate-800" data-module="form-submissions">Form Submissions</button>
</nav>
  </aside>

  <!-- Main Content Body -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <header id="standardHeader" class="bg-white shadow px-6 py-4 flex justify-between items-center z-10">
      <div>
        <h2 id="pageTitle" class="text-2xl font-bold">Employees</h2>
        <p class="text-slate-500">Manage records <span id="recordCount"></span></p>
      </div>
      <div class="flex gap-3 items-center">
        <div class="relative inline-block text-left" id="columnSelectorContainer">
          <button id="columnDropdownBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium">
            ⚙️ Columns & Sizing
          </button>
          <div id="columnDropdown" class="dropdown-menu hidden absolute right-0 mt-2 w-72 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 p-4 space-y-3 max-h-80 overflow-y-auto z-50"></div>
        </div>
        <input id="searchBox" placeholder="Search..." class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="newBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">+ New Record</button>
      </div>
    </header>

    <section class="flex-1 overflow-auto p-6">
      <!-- Standard Data Table View Wrapper -->
      <div id="tableViewWrapper" class="bg-white rounded-xl shadow overflow-hidden flex flex-col h-full justify-between">
        <div class="overflow-auto flex-1">
          <table class="w-full table-fixed">
            <thead id="tableHead" class="bg-slate-200 sticky top-0 z-0"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        
        <!-- Pagination Controls Footer -->
        <div class="bg-slate-50 border-t px-6 py-4 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-4 text-sm text-slate-600">
            <div>
              Show 
              <select id="pageSizeSelector" class="border rounded px-2 py-1 mx-1 bg-white focus:outline-none">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
              </select>
              entries
            </div>
            <div id="paginationInfo">Showing 0 to 0 of 0 entries</div>
          </div>
          <div class="flex gap-2" id="paginationButtons"></div>
        </div>
      </div>

      <!-- Specialized Printer Dashboard View -->
      <div id="printerViewWrapper" class="hidden space-y-6 h-full overflow-y-auto">
        
        

        <div class="flex justify-end">
          <!-- add new printer button -->
          <button id="newPrinterBtn" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg flex items-center gap-2 font-medium transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>New Printer</span>
          </button>

          <button id="refreshButton" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg flex items-center gap-2 font-medium transition">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            <span>Refresh</span>
          </button>
        </div>
       
        
        <div id="printer-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-6"></div>
      </div>
    </section>
  </main>
</div>

<!-- Slide-out Configuration and Input Drawer -->
<div id="drawer" class="fixed top-0 right-[-600px] h-full w-[550px] bg-white shadow-2xl transition-all duration-300 overflow-auto z-50 border-l border-slate-200">
  <div class="p-6 border-b flex justify-between items-center bg-slate-50">
    <h3 id="drawerTitle" class="text-xl font-bold text-slate-800">Modify Record</h3>
    <button id="closeDrawerBtn" class="text-slate-400 hover:text-rose-600 font-bold text-xl transition">✕</button>
  </div>
  <div class="p-6">
    <form id="recordForm" class="space-y-4"></form>
  </div>
</div>

<!-- Toast Container notification feed -->
<div id="toast-container" class="fixed bottom-5 right-5 space-y-3 z-50 pointer-events-none"></div>

<script type="module" src="./app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
  // --- Collapsible Submenu Toggle ---
  const toggleBtn = document.getElementById("printersMenuToggle");
  const submenu = document.getElementById("printersSubmenu");
  const arrow = document.getElementById("printersArrow");

  if (toggleBtn && submenu) {
    toggleBtn.addEventListener("click", () => {
      const isHidden = submenu.classList.toggle("hidden");
      if (arrow) {
        arrow.style.transform = isHidden ? "rotate(0deg)" : "rotate(180deg)";
      }
    });
  }

  // --- Active Class Handling for Nav Buttons ---
  document.querySelectorAll(".nav-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-btn").forEach((b) => {
        b.classList.remove("bg-slate-800", "text-white", "font-semibold");
      });
      btn.classList.add("bg-slate-800", "text-white", "font-semibold");
      activePrinterId = null;
      loadModule(btn.dataset.module);
    });
  });

  // ... rest of DOMContentLoaded setup ...
});
</script>
</body>
</html>
